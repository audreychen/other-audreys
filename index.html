<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07110b">
  <meta name="description" content="Finding Audrey Chen — a tiny terminal adventure.">
  <title>Finding Audrey Chen</title>
  <link rel="stylesheet" href="style.css">
  <script src="destinations.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="terminal" aria-label="Finding Audrey Chen terminal">
    <div class="topbar"><span class="light"></span><span>FINDING_AUDREY_CHEN.EXE</span><span class="status">ONLINE</span></div>
    <div class="content">
      <p class="muted">THE INTERNET // PERSON LOCATOR v1.0</p>
      <pre id="ascii" aria-hidden="true">FINDING AUDREY CHEN</pre>
      <h1 class="sr-only">Finding Audrey Chen</h1>
      <div id="log" class="log" role="status" aria-live="polite" aria-atomic="false"></div>
      <div id="result" class="result" aria-live="polite"></div>
      <button id="retry" type="button" hidden>SEARCH AGAIN ↵</button>
    </div>
    <footer><span>CTRL + R TO RESTART</span><span id="clock">● CONNECTION ESTABLISHED</span></footer>
  </main>
</body>
</html>
